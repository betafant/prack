[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prack"
version = "0.1.0"
description = "prack (paragliding & track): live OGN tracking and flight archive for paragliders, hang gliders and gliders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pillow>=10.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
prack = "prack.cli:main"

[tool.setuptools.packages.find]
include = ["prack*"]

[tool.setuptools.package-data]
prack = ["regions/*.toml", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
