# Pressure gradients (a - b, hPa) that characterise the day.
[[gradients]]
id = "foehn"
name = "Föhn index Lugano–Zürich"
a = "lugano"
b = "zurich"
threshold = 4.0
positive_label = "South föhn"
negative_label = "North föhn"

[[gradients]]
id = "bise"
name = "Bise index Zürich–Genève"
a = "zurich"
b = "geneva"
threshold = 3.0
positive_label = "Bise"
negative_label = "Westerly"
