# Switzerland. Copy this file to add another region (e.g. at.toml, fr-alps.toml)
# and enable it with PRACK_REGIONS=ch,at

id = "ch"
name = "Switzerland"
timezone = "Europe/Zurich"
# west, south, east, north (lon/lat, WGS84). New flights start only inside this box;
# the OGN feed is requested with an extra margin (PRACK_OGN_FILTER_MARGIN_KM) so
# cross-border legs keep being recorded.
bbox = [5.85, 45.75, 10.55, 47.85]
center = [8.23, 46.80]
zoom = 7.4
default_basemap = "swisstopo-grey"
# Open-Meteo model; empty = automatic best match
weather_model = ""

[[basemaps]]
id = "swisstopo-grey"
name = "Swisstopo grey"
tiles = ["https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-grau/default/current/3857/{z}/{x}/{y}.jpeg"]
max_zoom = 18
attribution = "© swisstopo"
paint = { "raster-brightness-max" = 0.72, "raster-contrast" = 0.1 }

[[basemaps]]
id = "swisstopo"
name = "Swisstopo"
tiles = ["https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg"]
max_zoom = 18
attribution = "© swisstopo"
paint = { "raster-brightness-max" = 0.9 }

[[basemaps]]
id = "swissimage"
name = "SWISSIMAGE"
tiles = ["https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg"]
max_zoom = 19
attribution = "© swisstopo"

[[basemaps]]
id = "icao"
name = "ICAO chart"
tiles = ["https://wmts.geo.admin.ch/1.0.0/ch.bazl.luftfahrtkarten-icao/default/current/3857/{z}/{x}/{y}.png"]
max_zoom = 13
attribution = "© BAZL / swisstopo"

[[basemaps]]
id = "glider-chart"
name = "Glider chart"
tiles = ["https://wmts.geo.admin.ch/1.0.0/ch.bazl.segelflugkarte/default/current/3857/{z}/{x}/{y}.png"]
max_zoom = 13
attribution = "© BAZL / swisstopo"

